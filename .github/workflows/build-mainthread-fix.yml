name: Build SnowLuma Parent Child Fix v2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - name: Checkout official 3.5.16 source
        uses: actions/checkout@v4
        with:
          repository: NapNeko/NapCatQQ-Desktop
          ref: '99ab7733b70afa910753aec0168c82962267a3d8'
          persist-credentials: false
      - name: Apply tested repair
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('MainThread-node-presence.patch', [Convert]::FromBase64String(''))
          git apply --check MainThread-node-presence.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not match upstream' }
          git apply MainThread-node-presence.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed' }
          git rev-parse HEAD | Set-Content SOURCE_COMMIT.txt
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff validation failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test Node identity probe
        run: python -B -m unittest discover -s crates/ncd-backend-snowluma/resources -p '*_test.py'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check version metadata
        run: pnpm run check:versions
      - name: Build Windows MSI
        run: pnpm run tauri:build:msi
      - name: Collect and validate outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path repair-artifacts | Out-Null
          $msis = @(Get-ChildItem target/release/bundle -Filter '*.msi' -Recurse -File)
          if ($msis.Count -eq 0) { throw 'No MSI produced' }
          foreach ($msi in $msis) {
            & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/assert-msi-layout.ps1 -MsiPath $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw 'MSI layout assertion failed' }
            Copy-Item -LiteralPath $msi.FullName -Destination repair-artifacts
          }
          Copy-Item SOURCE_COMMIT.txt,MainThread-node-presence.patch -Destination repair-artifacts
          Get-ChildItem repair-artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content repair-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SnowLuma-ParentChild-Fix-v2-3.5.16-Windows
          path: repair-artifacts/*
          if-no-files-found: error
          retention-days: 7
